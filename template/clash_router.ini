[custom]
; clash_router.ini - subconverter external config for ImmortalWrt nikki router
; lives in custom-rules repo (template/), same dir as clash_router.tpl
; request: /sub?target=clash&url=<subscription-url>&config=<this-ini local path or jsdelivr url>
;   e.g. config=https://cdn.jsdelivr.net/gh/cruise711808/custom-rules@main/template/clash_router.ini

; all split rules (incl. custom domain rules) live inside the template itself
enable_rule_generator=false
clash_rule_base=https://cdn.jsdelivr.net/gh/cruise711808/custom-rules@main/template/clash_router.tpl
;clash_rule_base=base/clash_router.tpl  ; if the tpl is copied into subconverter's base/ dir instead

; ---- region level: nodes come from the subscription link, matched by remark regex ----
custom_proxy_group=HK`select`香港
custom_proxy_group=TW`select`台湾
custom_proxy_group=JP`select`日本
custom_proxy_group=SG`select`新加坡
custom_proxy_group=US`select`美国
; SP = nodes without their own region group (Traffic/Expire info lines skipped)
custom_proxy_group=SP`select`^(?!.*(香港|台湾|日本|新加坡|美国|Traffic|Expire)).+$

; ---- destination level: region groups + DIRECT (unrestricted) ----
custom_proxy_group=proxy`select`[]HK`[]TW`[]JP`[]SG`[]US`[]SP`[]DIRECT
custom_proxy_group=unlock`select`[]JP`[]SG`[]HK`[]TW`[]US`[]SP`[]DIRECT
custom_proxy_group=oversea`select`[]US`[]HK`[]TW`[]JP`[]SG`[]SP`[]DIRECT
custom_proxy_group=download`select`[]DIRECT`[]HK`[]TW`[]JP`[]SG`[]US`[]SP

; ---- service level: members = destinations only ----
custom_proxy_group=YouTube`select`[]proxy`[]unlock`[]oversea`[]download
custom_proxy_group=Disney`select`[]proxy`[]unlock`[]oversea`[]download
custom_proxy_group=Netflix`select`[]proxy`[]unlock`[]oversea`[]download
custom_proxy_group=Bahamut`select`[]proxy`[]unlock`[]oversea`[]download
custom_proxy_group=Bilibili`select`[]proxy`[]unlock`[]oversea`[]download
custom_proxy_group=Spotify`select`[]proxy`[]unlock`[]oversea`[]download
custom_proxy_group=Steam`select`[]proxy`[]unlock`[]oversea`[]download
custom_proxy_group=Telegram`select`[]proxy`[]unlock`[]oversea`[]download
custom_proxy_group=Google`select`[]proxy`[]unlock`[]oversea`[]download
custom_proxy_group=Microsoft`select`[]proxy`[]unlock`[]oversea`[]download
custom_proxy_group=PayPal`select`[]proxy`[]unlock`[]oversea`[]download
custom_proxy_group=Apple`select`[]proxy`[]unlock`[]oversea`[]download
custom_proxy_group=OpenAI`select`[]unlock`[]proxy`[]oversea`[]download
custom_proxy_group=Hbomax`select`[]oversea`[]proxy`[]unlock`[]download

; ---- catch-all ----
custom_proxy_group=Final`select`[]proxy`[]unlock`[]oversea`[]download`[]DIRECT
